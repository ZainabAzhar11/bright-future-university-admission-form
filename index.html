
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bright Future University Admission Form</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #edf2f8;
      color: #172b4d;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }

    .header {
      background: linear-gradient(135deg, #102c57, #205295);
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      font-size: 16px;
    }

    .content {
      padding: 35px;
    }

    h2 {
      color: #102c57;
      border-bottom: 2px solid #e1e8f0;
      padding-bottom: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      margin-bottom: 9px;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #205295;
      box-shadow: 0 0 0 3px #dbeafe;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    #otherCity {
      display: none;
      margin-top: 10px;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      background: #102c57;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #205295;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }

    .success { color: green; }
    .error { color: #c62828; }

    .footer {
      text-align: center;
      padding: 18px;
      background: #f8fafc;
      color: #64748b;
    }

    @media (max-width: 650px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .content {
        padding: 20px;
      }

      .header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>BRIGHT FUTURE UNIVERSITY</h1>
      <p>Online Admission Application Form</p>
    </div>

    <div class="content">

      <h2>Student Information</h2>

      <form id="admissionForm">

        <div class="form-grid">

          <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName"
              placeholder="Enter full name" required>
          </div>

          <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email"
              placeholder="Enter email address" required>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone"
              placeholder="03XXXXXXXXX" required>
          </div>

          <div class="form-group">
            <label for="dob">Date of Birth *</label>
            <input type="date" id="dob" required>
          </div>

          <div class="form-group">
            <label for="gender">Gender *</label>
            <select id="gender" required>
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="city">City *</label>

            <select id="city" required
              onchange="toggleOtherCity()">

              <option value="">Select City</option>
              <option value="Faisalabad">Faisalabad</option>
              <option value="Lahore">Lahore</option>
              <option value="Karachi">Karachi</option>
              <option value="Islamabad">Islamabad</option>
              <option value="Rawalpindi">Rawalpindi</option>
              <option value="Multan">Multan</option>
              <option value="Peshawar">Peshawar</option>
              <option value="Quetta">Quetta</option>
              <option value="Gujranwala">Gujranwala</option>
              <option value="Sialkot">Sialkot</option>
              <option value="Sargodha">Sargodha</option>
              <option value="Bahawalpur">Bahawalpur</option>
              <option value="Sahiwal">Sahiwal</option>
              <option value="Hyderabad">Hyderabad</option>
              <option value="Abbottabad">Abbottabad</option>
              <option value="Sheikhupura">Sheikhupura</option>
              <option value="Jhang">Jhang</option>
              <option value="Okara">Okara</option>
              <option value="Rahim Yar Khan">Rahim Yar Khan</option>
              <option value="Sukkur">Sukkur</option>
              <option value="Other">Other</option>

            </select>

            <input type="text" id="otherCity"
              placeholder="Enter your city name">
          </div>

          <div class="form-group">
            <label for="qualification">
              Previous Qualification *
            </label>

            <select id="qualification" required>
              <option value="">Select Qualification</option>
              <option value="Matriculation">Matriculation (SSC)</option>
              <option value="O Levels">O Levels</option>
              <option value="Intermediate">Intermediate (HSSC)</option>
              <option value="FSc Pre-Medical">FSc Pre-Medical</option>
              <option value="FSc Pre-Engineering">FSc Pre-Engineering</option>
              <option value="ICS">ICS</option>
              <option value="ICom">I.Com</option>
              <option value="FA">FA</option>
              <option value="A Levels">A Levels</option>
              <option value="DAE">DAE Diploma</option>
              <option value="ADP">Associate Degree (ADP)</option>
              <option value="BA">BA</option>
              <option value="BSc">BSc</option>
              <option value="BCom">B.Com</option>
              <option value="BS">BS</option>
              <option value="BBA">BBA</option>
              <option value="MA">MA</option>
              <option value="MSc">MSc</option>
              <option value="MBA">MBA</option>
              <option value="MS">MS</option>
              <option value="MPhil">MPhil</option>
              <option value="PhD">PhD</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="marks">Marks Percentage *</label>
            <input type="number" id="marks"
              min="0" max="100" step="0.01"
              placeholder="Enter percentage" required>
          </div>

          <div class="form-group full-width">
            <label for="department">
              Choose Department *
            </label>

            <select id="department" required>
              <option value="">Select Department</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Software Engineering">Software Engineering</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Artificial Intelligence">Artificial Intelligence</option>
              <option value="Data Science">Data Science</option>
              <option value="Business Administration">Business Administration</option>
              <option value="Accounting and Finance">Accounting and Finance</option>
              <option value="English">English</option>
              <option value="Mathematics">Mathematics</option>
              <option value="Physics">Physics</option>
              <option value="Chemistry">Chemistry</option>
              <option value="Psychology">Psychology</option>
              <option value="Education">Education</option>
              <option value="Economics">Economics</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label for="address">Home Address *</label>
            <textarea id="address"
              placeholder="Enter your complete address"
              required></textarea>
          </div>

        </div>

        <button type="submit" id="submitBtn">
          Submit Application
        </button>

        <div id="message" role="status"
          aria-live="polite"></div>

      </form>

    </div>

    <div class="footer">
      Bright Future University | Admission Portal
    </div>

  </div>

  <script>

    function toggleOtherCity() {
      const city = document.getElementById("city");
      const otherCity = document.getElementById("otherCity");

      if (city.value === "Other") {
        otherCity.style.display = "block";
        otherCity.required = true;
      } else {
        otherCity.style.display = "none";
        otherCity.required = false;
        otherCity.value = "";
      }
    }

    document.getElementById("admissionForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const citySelection =
          document.getElementById("city").value;

        const finalCity = citySelection === "Other"
          ? document.getElementById("otherCity").value.trim()
          : citySelection;

        const data = {
          fullName: document.getElementById("fullName").value.trim(),
          email: document.getElementById("email").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          dob: document.getElementById("dob").value,
          gender: document.getElementById("gender").value,
          city: finalCity,
          qualification: document.getElementById("qualification").value,
          marks: document.getElementById("marks").value,
          department: document.getElementById("department").value,
          address: document.getElementById("address").value.trim()
        };

        const button = document.getElementById("submitBtn");
        const message = document.getElementById("message");

        button.disabled = true;
        button.textContent = "Submitting...";
        message.textContent = "";
        message.className = "";

        if (typeof google === "undefined" ||
            !google.script || !google.script.run) {

          message.textContent =
            "Preview Mode: Open the deployed Google Apps Script link to save data.";
          message.className = "error";

          button.disabled = false;
          button.textContent = "Submit Application";
          return;
        }

        google.script.run
          .withSuccessHandler(function(result) {
            message.textContent =
              result || "Application Submitted Successfully!";
            message.className = "success";

            document.getElementById("admissionForm").reset();
            toggleOtherCity();

            button.disabled = false;
            button.textContent = "Submit Application";
          })
          .withFailureHandler(function(error) {
            message.textContent =
              "Error: " + (error.message || error);
            message.className = "error";

            button.disabled = false;
            button.textContent = "Submit Application";
          })
          .submitAdmission(data);

      });

  </script>

</body>
</html>
